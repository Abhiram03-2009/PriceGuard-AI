name: Build and Deploy PriceGuard AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── Web Build & Deploy (GitHub Pages) ────────────────────────────────────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./priceguard-react-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: priceguard-react-app/package-lock.json

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        env:
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_OPENAI_MODEL: gpt-3.5-turbo
          # NOTE: REACT_APP_OPENAI_KEY is intentionally omitted from the build env.
          # Baking it into the JS bundle exposes it publicly. Users supply their own
          # key at runtime via the Chat tab (saved to localStorage). The local advisor
          # fallback handles all queries when no key is present.
          CI: false
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: priceguard-react-app/build
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./priceguard-react-app/build
          publish_branch: gh-pages
          force_orphan: true

  # ── iOS Build ─────────────────────────────────────────────────────────────────
  build-ios:
    name: Build and Submit iOS App
    runs-on: macos-26
    needs: build-web
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./priceguard-react-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        env:
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_IOS_CLIENT_ID }}
          REACT_APP_OPENAI_MODEL: gpt-3.5-turbo
          # NOTE: REACT_APP_OPENAI_KEY is intentionally omitted from the build env.
          # Baking it into the JS bundle exposes it publicly. Users supply their own
          # key at runtime via the Chat tab (saved to localStorage). The local advisor
          # fallback handles all queries when no key is present.
          CI: false
        run: npm run build

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security find-identity -v -p codesigning $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PP_UUID=$UUID" >> $GITHUB_ENV

      - name: Build and Archive Xcode Project
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios/App
          # Use GitHub run number as CFBundleVersion — always increments, never repeats
          BUILD_NUM=$(( 100 + ${{ github.run_number }} ))
          echo "Using CFBundleVersion: $BUILD_NUM"
          # CODE_SIGNING_ALLOWED=NO here (instead of forcing CODE_SIGN_STYLE/PROVISIONING_PROFILE
          # on the archive action) because those overrides apply to every target in the build,
          # including the resource-bundle helper targets Xcode auto-generates for SPM packages
          # like GoogleSignIn's dependency tree (GoogleUtilities, AppAuth, etc.) — those bundle
          # targets can't carry a provisioning profile and the archive hard-fails if one is forced
          # on them. Manual signing is applied for real at the -exportArchive step below instead,
          # via exportOptions.plist, which only touches the App target.
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination generic/platform=iOS \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            MARKETING_VERSION=1.5

          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" exportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" exportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.priceguard.ai string $PP_UUID" exportOptions.plist || true

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -f $RUNNER_TEMP/build/App.ipa \
            -t ios \
            --apiKey $APPSTORE_API_KEY_ID \
            --apiIssuer $APPSTORE_ISSUER_ID
