name: Build and Release iOS App — v10

on:
  push:
    branches:
      - main
      - agents/app-store-final-polish-and-testing
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: Build and Submit iOS App
    runs-on: macos-26
    
    defaults:
      run:
        working-directory: ./priceguard-react-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        env:
          REACT_APP_OPENAI_API_KEY: ${{ secrets.REACT_APP_OPENAI_API_KEY }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_APPLE_CLIENT_ID: ${{ secrets.REACT_APP_APPLE_CLIENT_ID }}
          REACT_APP_AUTH_PROXY_URL: ${{ secrets.REACT_APP_AUTH_PROXY_URL }}
        run: npm run build

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # ADD the temporary keychain to the search list so xcodebuild can find it
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # verify certificate was imported
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PP_UUID=$UUID" >> $GITHUB_ENV

      - name: Build and Archive Xcode Project
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios/App
          # Build the archive
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination generic/platform=iOS \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE="$PP_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          # Inject provisioning profile mapping into exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" exportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.priceguard.ai string $PP_UUID" exportOptions.plist || true

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # Create private key file in the directory altool expects
          mkdir -p ~/.private_keys
          if [ -z "${APPSTORE_API_KEY_ID:-}" ] || [ -z "${APPSTORE_ISSUER_ID:-}" ] \
             || [ -z "${APPSTORE_API_PRIVATE_KEY:-}" ]; then
            echo "::error::APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID or APPSTORE_API_PRIVATE_KEY is empty."
            exit 1
          fi

          # Secrets pasted through a browser often carry a trailing newline or
          # stray spaces. Either corrupts the signed JWT, and Apple answers 401
          # without indicating that the credential rather than the key is wrong.
          KEY_ID="$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf '%s' "$APPSTORE_ISSUER_ID" | tr -d '[:space:]')"

          if [ "${#KEY_ID}" -ne "${#APPSTORE_API_KEY_ID}" ] || [ "${#ISSUER_ID}" -ne "${#APPSTORE_ISSUER_ID}" ]; then
            echo "::warning::Stripped whitespace from a credential. Re-save that secret with no trailing newline."
          fi

          if ! printf '%s' "$KEY_ID" | grep -qE '^[A-Za-z0-9]{10}$'; then
            echo "::error::APPSTORE_API_KEY_ID should be 10 characters. Got ${#KEY_ID}."
            exit 1
          fi
          if ! printf '%s' "$ISSUER_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::APPSTORE_ISSUER_ID should be a 36 character UUID. Got ${#ISSUER_ID}."
            exit 1
          fi
          echo "Key ID and Issuer ID are well formed."

          KEY=~/.private_keys/AuthKey_${KEY_ID}.p8
          # printf keeps the trailing newline that `echo -n` strips; altool
          # rejects a .p8 without it and reports it as a 401, not a parse error.
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            echo "::error::APPSTORE_API_PRIVATE_KEY is not a PEM key. Paste the .p8 contents verbatim, BEGIN/END lines included."
            exit 1
          fi
          echo "Wrote a $(wc -l < "$KEY" | tr -d ' ') line private key file."
          
          # Upload via xcrun altool
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/build/App.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
